name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        variant: [development, production]
    env:
      SNIPPET_BUILD_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test behavior
        run: bash scripts/test.sh
      - name: Build universal app
        env:
          SNIPPET_UNIVERSAL: '1'
        run: bash scripts/build.sh
      - name: Verify bundle
        run: |
          if [ "$SNIPPET_BUILD_VARIANT" = development ]; then
            app="dist/Snippet Dev.app"; bundle=local.snippet.dev
          else
            app="dist/Snippet.app"; bundle=local.snippet.app
          fi
          codesign --verify --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          "$app/Contents/MacOS/$executable" --verify-environment
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = "$bundle"
      - name: Verify installer packaging
        if: matrix.variant == 'production'
        run: |
          bash scripts/package-dmg.sh "$PWD/dist/Snippet.app" "$PWD/.build/Installer-preview.dmg" preview
          hdiutil verify .build/Installer-preview.dmg
